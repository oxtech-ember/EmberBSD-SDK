name: SDK host contracts

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Report native integration prerequisites
        shell: bash
        run: |
          if [ -z "${EMBERBSD_TEST_HOST_PREFIX:-}" ]; then
            echo '::notice::Native OpenSSL/pkg_tools signing and package lifecycle contracts are skipped: EMBERBSD_TEST_HOST_PREFIX is unset.'
            echo 'Native signing and package lifecycle contracts require a prepared Ports prefix and are skipped in this job. Autonomous publication recovery tests run below; they do not qualify native cryptography or package installation.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check host contracts without an OS build or release write
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
