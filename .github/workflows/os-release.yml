name: Complete OS release producer

'on':
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [aarch64-sysroot, amd64]
        required: true
      os_source:
        description: Absolute clean and fully materialized OS checkout
        required: true
      os_commit:
        description: Exact full OS commit in that checkout
        required: true
      ports_source:
        description: Absolute clean and fully materialized Ports checkout
        required: true
      ports_commit:
        description: Exact full Ports commit in that checkout
        required: true
      workspace:
        description: Existing target-declared shared SDK workspace
        required: true
      compiler:
        description: Common Ports target compiler prefix
        required: true
      compiler_family:
        type: choice
        options: [clang, gcc]
        default: clang
        required: true
      host_prefix:
        description: Absolute native Ports tool prefix
        required: true
      host_compiler_family:
        type: choice
        options: [clang, gcc]
        default: clang
        required: true
      sdk_python:
        description: Absolute Python 3.15+ interpreter inside host_prefix
        required: true
      libedit_source:
        description: Prepared libedit source for the selected Ports recipe
        required: true
      runtime_work:
        description: LLVM work directory inside SDK/obj, or existing GCC runtime work
        required: true
      llvm_source:
        description: Common prepared LLVM source for libc and kernel builtins
        required: true
      llvm_runtime_stage:
        description: Optional completed full LLVM stage to reuse
        required: false
      gcc_archive:
        description: Original GCC source archive used by the runtime
        required: false
      pkgsrc:
        description: Exact prepared pkgsrc input for runtime verification
        required: false

permissions:
  contents: read

concurrency:
  group: complete-os-release-${{ inputs.workspace }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, emberbsd-release]
    timeout-minutes: 720
    env:
      PROFILE: ${{ inputs.profile }}
      OS_SOURCE: ${{ inputs.os_source }}
      OS_COMMIT: ${{ inputs.os_commit }}
      PORTS_SOURCE: ${{ inputs.ports_source }}
      PORTS_COMMIT: ${{ inputs.ports_commit }}
      SDK_WORKSPACE: ${{ inputs.workspace }}
      COMPILER: ${{ inputs.compiler }}
      COMPILER_FAMILY: ${{ inputs.compiler_family }}
      HOST_PREFIX: ${{ inputs.host_prefix }}
      HOST_COMPILER_FAMILY: ${{ inputs.host_compiler_family }}
      SDK_PYTHON: ${{ inputs.sdk_python }}
      LIBEDIT_SOURCE: ${{ inputs.libedit_source }}
      RUNTIME_WORK: ${{ inputs.runtime_work }}
      LLVM_SOURCE: ${{ inputs.llvm_source }}
      LLVM_RUNTIME_STAGE: ${{ inputs.llvm_runtime_stage }}
      GCC_ARCHIVE: ${{ inputs.gcc_archive }}
      PKGSRC: ${{ inputs.pkgsrc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify explicitly pinned sources and host Python
        run: |
          case "$SDK_PYTHON" in /*) ;; *) exit 2 ;; esac
          "$SDK_PYTHON" - <<'PY'
          import os, re, subprocess, sys
          if sys.version_info < (3, 15):
              raise SystemExit('The prepared runner must provide Python 3.15+')
          for name in ('OS', 'PORTS'):
              pin = os.environ[name + '_COMMIT']
              if not re.fullmatch('[0-9a-f]{40}', pin):
                  raise SystemExit('A full commit is required for ' + name)
              actual = subprocess.check_output(['git', '-C', os.environ[name + '_SOURCE'], 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin:
                  raise SystemExit('Source pin mismatch for ' + name)
          PY
          printf 'DESTINATION=%s/stages/release-%s-%s\n' "$SDK_WORKSPACE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Plan and build
        run: |
          set -- --profile "$PROFILE" --python "$SDK_PYTHON" \
            --sdk-source "$GITHUB_WORKSPACE" --sdk "$SDK_WORKSPACE" \
            --os-source "$OS_SOURCE" --ports "$PORTS_SOURCE" --compiler "$COMPILER" \
            --host-prefix "$HOST_PREFIX" --libedit-source "$LIBEDIT_SOURCE" \
            --compiler-family "$COMPILER_FAMILY" --host-compiler-family "$HOST_COMPILER_FAMILY" \
            --llvm-source "$LLVM_SOURCE" \
            --runtime-work "$RUNTIME_WORK" \
            --destination "$DESTINATION" --jobs 4
          case "$COMPILER_FAMILY" in
            clang)
              if [ -n "$LLVM_RUNTIME_STAGE" ]; then
                set -- "$@" --llvm-runtime-stage "$LLVM_RUNTIME_STAGE"
              fi ;;
            gcc) set -- "$@" --gcc-archive "$GCC_ARCHIVE" --pkgsrc "$PKGSRC" ;;
            *) exit 2 ;;
          esac
          "$SDK_PYTHON" -B scripts/build-os-release.py "$@" --plan
          "$SDK_PYTHON" -B scripts/build-os-release.py "$@"
      - name: Preserve producer evidence
        if: always() && env.DESTINATION != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-release-evidence-${{ inputs.os_commit }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ env.DESTINATION }}/.prebuild-sdk-build.json
            ${{ env.DESTINATION }}/.prebuild-sdk-build.log
            ${{ env.DESTINATION }}/build-profile.json
            ${{ env.DESTINATION }}/build-success
      - name: Identify retained candidate and acceptance boundary
        if: always() && env.DESTINATION != ''
        run: |
          printf 'Producer destination: `%s`\n\n' "$DESTINATION" >> "$GITHUB_STEP_SUMMARY"
